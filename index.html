<html lang="hi">
<head>
<meta charset="UTF-8">
<title>RAMPRAKASH (@rp_gupta_07) | Elite Arena Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root { 
    --primary: #00f2ff; 
    --primary-glow: rgba(0, 242, 255, 0.45);
    --secondary: #8a2be2;
    --accent: #ff0055;
    --accent-glow: rgba(255, 0, 85, 0.45);
    --win: #00ff88;
    --gold: #ffd700;
    --bg: #04050a; 
    --glass: rgba(14, 18, 30, 0.72);
    --glass-border: rgba(255, 255, 255, 0.12);
    --turn-color: #00f2ff;
    --turn-glow: rgba(0, 242, 255, 0.3);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

body, html { 
    margin: 0; padding: 0; height: 100%; width: 100%; 
    background: var(--bg); color: #fff; font-family: 'Rajdhani', sans-serif;
    overflow: hidden; position: fixed;
}

/* 3D Animated Esports Cyber Grid Background */
.cyber-bg {
    position: fixed; inset: 0; z-index: -2;
    background: radial-gradient(circle at 50% 20%, #12172d 0%, #04050a 80%);
    overflow: hidden;
}
.cyber-grid {
    position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
    background-image: 
        linear-gradient(to right, rgba(0, 242, 255, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 242, 255, 0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    transform: perspective(500px) rotateX(60deg);
    animation: gridMove 12s linear infinite;
}
@keyframes gridMove {
    0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
    100% { transform: perspective(500px) rotateX(60deg) translateY(40px); }
}

.ambient-aura {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(circle at 50% 45%, var(--turn-glow), transparent 65%);
    transition: background 0.6s ease;
}

.container { 
    display: flex; flex-direction: column; height: 100%; max-width: 460px; 
    margin: auto; position: relative;
    border-left: 1px solid rgba(255,255,255,0.04);
    border-right: 1px solid rgba(255,255,255,0.04);
}

/* Creator VIP Badge */
.creator-banner {
    background: linear-gradient(90deg, rgba(0,242,255,0.12), rgba(138,43,226,0.18), rgba(255,0,85,0.12));
    border: 1px solid rgba(0,242,255,0.3);
    border-radius: 30px; padding: 6px 16px; margin-bottom: 12px;
    display: inline-flex; align-items: center; gap: 8px;
    box-shadow: 0 0 20px rgba(0, 242, 255, 0.15);
}
.vip-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--win);
    box-shadow: 0 0 10px var(--win); animation: pulseDot 1.5s infinite;
}
@keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } }

/* Screens */
.screen { 
    flex: 1; display: flex; flex-direction: column; align-items: center; 
    justify-content: center; padding: 18px; overflow-y: auto;
    animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes slideUp { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }

.hero-title { 
    font-family: 'Orbitron', sans-serif; font-size: 36px; font-weight: 900; 
    letter-spacing: 2px; margin: 0; text-align: center; line-height: 1.05;
    text-shadow: 0 0 25px rgba(0, 242, 255, 0.4);
}
.hero-sub {
    font-family: 'Orbitron', sans-serif; font-size: 28px; font-weight: 900;
    background: linear-gradient(90deg, var(--primary), #fff, var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: 3px; margin-bottom: 4px;
}

.glass-panel {
    width: 100%; background: var(--glass); backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border); border-radius: 20px; padding: 16px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
}

.input-label {
    font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: var(--primary);
    text-transform: uppercase; margin-bottom: 5px; display: block;
}

input { 
    width: 100%; padding: 13px 15px; border-radius: 12px; 
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0, 0, 0, 0.55); color: #fff; font-family: 'Rajdhani', sans-serif;
    font-size: 16px; font-weight: 700; letter-spacing: 1px;
    transition: 0.3s; outline: none; margin-bottom: 12px; user-select: text;
}
input:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }

/* Selectors */
.selector-row { display: flex; gap: 8px; margin-bottom: 12px; width: 100%; }
.chip-btn { 
    flex: 1; padding: 10px 6px; background: rgba(255,255,255,0.04); 
    border: 1px solid rgba(255,255,255,0.1); color: #aaa; border-radius: 10px; 
    font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700; 
    cursor: pointer; transition: 0.25s;
}
.chip-btn.active { 
    background: rgba(0, 242, 255, 0.15); border-color: var(--primary); 
    color: #fff; box-shadow: 0 0 15px var(--primary-glow);
}
.chip-btn.ai-active {
    background: rgba(255, 0, 85, 0.18); border-color: var(--accent);
    color: #fff; box-shadow: 0 0 15px var(--accent-glow);
}

/* Buttons */
.btn-main { 
    width: 100%; padding: 14px; border-radius: 12px; border: none; 
    font-family: 'Orbitron', sans-serif; font-weight: 800; letter-spacing: 1.5px;
    font-size: 13px; cursor: pointer; text-transform: uppercase; margin-bottom: 9px;
    transition: all 0.2s ease; position: relative; overflow: hidden;
}
.btn-main:active { transform: scale(0.97); }
.btn-primary { 
    background: linear-gradient(135deg, #00f2ff, #0088ff); color: #000; 
    box-shadow: 0 4px 20px rgba(0, 242, 255, 0.4); 
}
.btn-global {
    background: linear-gradient(135deg, #8a2be2, #ff0055); color: #fff;
    box-shadow: 0 4px 20px rgba(255, 0, 85, 0.35);
}
.btn-outline {
    background: rgba(255,255,255,0.05); color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
}
.btn-outline:hover { border-color: var(--primary); background: rgba(0,242,255,0.08); }

/* Top HUD Bar */
.top-hud {
    padding: 10px 14px; display: flex; justify-content: space-between; align-items: center;
    background: rgba(8, 10, 18, 0.9); border-bottom: 1px solid rgba(255,255,255,0.08);
}
.hud-btn {
    background: rgba(255,255,255,0.06); color: #fff; border: 1px solid rgba(255,255,255,0.15);
    padding: 6px 10px; border-radius: 8px; font-family: 'Orbitron', sans-serif;
    font-size: 10px; font-weight: 700; cursor: pointer; transition: 0.2s;
}
.hud-btn:active { transform: scale(0.95); }
.hud-btn.danger { color: var(--accent); border-color: rgba(255,0,85,0.4); }

.room-badge {
    background: rgba(0, 242, 255, 0.1); border: 1px solid rgba(0, 242, 255, 0.3);
    padding: 5px 10px; border-radius: 8px; font-family: 'Orbitron', sans-serif;
    font-size: 11px; color: var(--primary); cursor: pointer; display: flex; align-items: center; gap: 5px;
}

/* Esports Player Cards & Scoreboard */
.esports-hud {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; gap: 8px; margin-bottom: 8px;
}
.player-card {
    flex: 1; background: var(--glass); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px; padding: 8px 10px; position: relative; transition: 0.35s;
    overflow: hidden;
}
.player-card.active-turn-x {
    border-color: var(--primary); box-shadow: 0 0 20px rgba(0, 242, 255, 0.25);
    background: linear-gradient(135deg, rgba(0,242,255,0.12), rgba(14,18,30,0.8));
}
.player-card.active-turn-o {
    border-color: var(--accent); box-shadow: 0 0 20px rgba(255, 0, 85, 0.25);
    background: linear-gradient(135deg, rgba(255,0,85,0.12), rgba(14,18,30,0.8));
}
.p-header { display: flex; justify-content: space-between; align-items: center; }
.p-sym { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 14px; }
.p-rank { font-size: 9px; padding: 2px 6px; border-radius: 4px; background: rgba(255,215,0,0.15); color: var(--gold); font-weight: 700; letter-spacing: 0.5px; }
.p-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 2px 0; }
.p-score { font-family: 'Orbitron', sans-serif; font-size: 22px; font-weight: 900; line-height: 1; }

.vs-badge {
    font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 900;
    color: #666; background: rgba(255,255,255,0.04); padding: 6px 8px; border-radius: 50%;
}

/* Turn Countdown Bar */
.timer-wrap {
    width: 100%; height: 4px; background: rgba(255,255,255,0.08);
    border-radius: 4px; overflow: hidden; margin-bottom: 10px;
}
.timer-bar {
    height: 100%; width: 100%; background: var(--turn-color);
    box-shadow: 0 0 10px var(--turn-color); transition: width 0.25s linear, background 0.3s;
}

/* 3D Arena Board */
.board-wrapper {
    position: relative; padding: 10px; border-radius: 18px;
    background: rgba(10, 14, 24, 0.85);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 25px rgba(0,242,255,0.05);
}
#board { display: grid; gap: 7px; position: relative; z-index: 2; }

.cell { 
    background: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01));
    border-radius: 12px; display: flex; align-items: center; justify-content: center; 
    font-family: 'Orbitron', sans-serif; font-weight: 900; 
    cursor: pointer; border: 1px solid rgba(255,255,255,0.08);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 4px 10px rgba(0,0,0,0.4);
    transition: transform 0.15s ease, border-color 0.2s, background 0.2s;
    position: relative;
}
.cell:hover:empty {
    border-color: var(--turn-color);
    background: rgba(255,255,255,0.08);
    transform: translateY(-2px);
}
.cell.placed { animation: slamIn 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
@keyframes slamIn {
    0% { transform: scale(1.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}
.cell.x-mark { color: var(--primary); text-shadow: 0 0 18px var(--primary-glow); }
.cell.o-mark { color: var(--accent); text-shadow: 0 0 18px var(--accent-glow); }

.cell.winner-cell {
    background: rgba(0, 255, 136, 0.22) !important;
    border-color: var(--win) !important;
    color: #fff !important;
    text-shadow: 0 0 20px var(--win) !important;
    box-shadow: 0 0 25px rgba(0, 255, 136, 0.5) !important;
    transform: scale(1.06);
    z-index: 5;
}

/* SVG Laser Beam Overlay */
#winLaserSvg {
    position: absolute; inset: 10px; width: calc(100% - 20px); height: calc(100% - 20px);
    pointer-events: none; z-index: 10;
}
.laser-line {
    stroke: var(--win); stroke-width: 6; stroke-linecap: round;
    filter: drop-shadow(0 0 10px var(--win)) drop-shadow(0 0 20px #fff);
    stroke-dasharray: 1000; stroke-dashoffset: 1000;
    animation: drawLaser 0.45s ease-out forwards;
}
@keyframes drawLaser { to { stroke-dashoffset: 0; } }

/* Quick Reactions & Quick Chat */
.reaction-bar {
    display: flex; align-items: center; gap: 6px; margin-top: 8px;
    background: rgba(255,255,255,0.04); padding: 5px 12px; border-radius: 25px;
    border: 1px solid rgba(255,255,255,0.08);
}
.react-emoji { cursor: pointer; font-size: 18px; transition: transform 0.15s; padding: 0 3px; }
.react-emoji:hover { transform: scale(1.3); }
.quick-pill {
    font-size: 10px; font-weight: 700; background: rgba(0,242,255,0.12);
    color: var(--primary); border: 1px solid rgba(0,242,255,0.3);
    padding: 3px 8px; border-radius: 12px; cursor: pointer;
}
.quick-pill:active { transform: scale(0.92); }

/* Chat Section */
.chat-section { 
    height: 125px; background: rgba(6, 8, 14, 0.96); 
    border-top: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column;
}
#messages { flex: 1; overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 5px; }
.msg { max-width: 82%; padding: 6px 11px; border-radius: 12px; font-size: 12px; line-height: 1.3; word-wrap: break-word; }
.me { align-self: flex-end; background: linear-gradient(135deg, #0072ff, #00c6ff); color: #fff; border-bottom-right-radius: 2px; }
.other { align-self: flex-start; background: #1e2230; color: #eee; border: 1px solid rgba(255,255,255,0.08); border-bottom-left-radius: 2px; }

/* Victory Overlay */
#winnerOverlay { 
    position: fixed; inset: 0; background: rgba(4, 5, 10, 0.94); backdrop-filter: blur(12px);
    z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center;
}
.ring-container { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: -1; }
.ring { position: absolute; border-radius: 50%; border: 2px solid transparent; animation: rotateRing 4s linear infinite; }
.ring:nth-child(1) { width: 280px; height: 280px; border-top-color: var(--primary); border-bottom-color: var(--secondary); }
.ring:nth-child(2) { width: 340px; height: 340px; border-left-color: var(--win); border-right-color: var(--accent); animation-duration: 6s; animation-direction: reverse; }
@keyframes rotateRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.winner-content { text-align: center; z-index: 10; padding: 20px; animation: popIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
@keyframes popIn { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* Toast Notification */
#toast {
    position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
    background: rgba(0, 242, 255, 0.9); color: #000; font-family: 'Orbitron', sans-serif;
    font-size: 11px; font-weight: 800; padding: 8px 18px; border-radius: 20px;
    z-index: 10001; opacity: 0; pointer-events: none; transition: 0.3s;
    box-shadow: 0 0 20px var(--primary-glow);
}

.hidden { display: none !important; }
</style>
</head>

<script>
// --- WEB AUDIO PROCEDURAL SOUND ENGINE (No external MP3 needed) ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let soundEnabled = true;

function playTone(freq, type, duration, vol = 0.12) {
    if (!soundEnabled) return;
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function createBoard(size) {

function startTurnTimer(currentTurn) {

            if (currentTurn === mySymbol) autoRandomMove();
        }
    }, 250);
}

function autoRandomMove() {
    gameRef.once("value", snap => {
        const g = snap.val();
        if (!g || g.turn !== mySymbol || checkWinner(g.board, g.size)) return;
        let empty = g.board.map((v, i) => v === "" ? i : null).filter(v => v !== null);
        if (empty.length > 0) move(empty[Math.floor(Math.random() * empty.length)]);
    });
}

function drawWinningLaser(lineIndices, size) {
    const svg = document.getElementById("winLaserSvg");
    const board = document.getElementById("board");
    if (!board.children.length) return;
    const firstCell = board.children[lineIndices[0]];
    const lastCell = board.children[lineIndices[lineIndices.length - 1]];
    const bRect = board.getBoundingClientRect();
    const fRect = firstCell.getBoundingClientRect();
    const lRect = lastCell.getBoundingClientRect();

    const x1 = (fRect.left - bRect.left) + fRect.width / 2;
    const y1 = (fRect.top - bRect.top) + fRect.height / 2;
    const x2 = (lRect.left - bRect.left) + lRect.width / 2;
    const y2 = (lRect.top - bRect.top) + lRect.height / 2;

    svg.innerHTML = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="laser-line" />`;
}

                        document.getElementById("winnerName").style.color = iWon ? "var(--win)" : "var(--accent)";

                        document.getElementById("winnerOverlay").style.display = "flex";

                    }, 950);

                        document.getElementById("winnerName").innerText = "MATCH DRAW!";
                        document.getElementById("winnerName").style.color = "var(--primary)";
                        document.getElementById("winStreakText").innerText = `🔥 WIN STREAK HELD: ${winStreak}`;
                        document.getElementById("winnerOverlay").style.display = "flex";

            }

            roundEnded = false;
            document.getElementById("winLaserSvg").innerHTML = "";

                statusEl.innerText = "WAITING FOR OPPONENT...";

                statusEl.innerText = "⚡ YOUR TURN";
                statusEl.style.color = "var(--win)";

            } else {
                statusEl.innerText = isRobot ? "🤖 AI CALCULATING..." : "⏳ OPPONENT TURN";
                statusEl.style.color = "var(--accent)";
                startTurnTimer(g.turn);
            }

            if (isRobot && g.turn === "O") {
                setTimeout(smartBot, 550);
            }
        }
    });
}

function move(i) {
    gameRef.once("value", snap => {
        const g = snap.val();
        if (!g || g.players.O === "WAITING..." || g.turn !== mySymbol || g.board[i] !== "" || checkWinner(g.board, g.size)) return;
        g.board[i] = mySymbol;

        let updateData = { board: g.board, turn: mySymbol === "X" ? "O" : "X" };
        const winCheck = checkWinner(g.board, g.size);
        if (winCheck && winCheck !== "draw") {
            g.scores[winCheck.w]++;
            updateData.scores = g.scores;
        }
        gameRef.update(updateData);
    });
}

// --- SMART & UNBEATABLE AI ENGINE ---
function smartBot() {
    gameRef.once("value", snap => {
        const g = snap.val();
        if (!g || g.turn !== "O" || checkWinner(g.board, g.size)) return;
        let b = [...g.board], s = g.size, moveIdx = -1;

        if (aiLevel === 'god' && s === 3) {
            moveIdx = getBestMinimaxMove(b);
        } else {
            // Pro / Tactical logic
            if (aiLevel !== 'easy') {
                // 1. Check immediate win
                for (let i = 0; i < b.length; i++) {
                    if (b[i] === "") { b[i] = "O"; if (checkWinner(b, s)) { moveIdx = i; break; } b[i] = ""; }
                }
                // 2. Block player win
                if (moveIdx === -1) {
                    for (let i = 0; i < b.length; i++) {
                        if (b[i] === "") { b[i] = "X"; if (checkWinner(b, s)) { moveIdx = i; break; } b[i] = ""; }
                    }
                }
                // 3. Take center if open
                const center = Math.floor(b.length / 2);
                if (moveIdx === -1 && b[center] === "") moveIdx = center;
            }
            if (moveIdx === -1) {
                let empty = b.map((v, i) => v === "" ? i : null).filter(v => v !== null);
                moveIdx = empty[Math.floor(Math.random() * empty.length)];
            }
        }

        if (moveIdx !== -1 && moveIdx !== undefined) {
            g.board[moveIdx] = "O";
            let updateData = { board: g.board, turn: "X" };
            const winCheck = checkWinner(g.board, g.size);
            if (winCheck && winCheck !== "draw") {
                g.scores.O++;
                updateData.scores = g.scores;
            }
            gameRef.update(updateData);
        }
    });
}

function getBestMinimaxMove(board) {
    let bestScore = -Infinity, bestMove = -1;
    for (let i = 0; i < 9; i++) {
        if (board[i] === "") {
            board[i] = "O";
            let score = minimax(board, 0, false);
            board[i] = "";
            if (score > bestScore) { bestScore = score; bestMove = i; }
        }
    }
    return bestMove;
}

function minimax(board, depth, isMaximizing) {
    const res = checkWinner(board, 3);
    if (res) {
        if (res === "draw") return 0;
        return res.w === "O" ? 10 - depth : depth - 10;
    }
    if (isMaximizing) {
        let best = -Infinity;
        for (let i = 0; i < 9; i++) {
            if (board[i] === "") {
                board[i] = "O";
                best = Math.max(best, minimax(board, depth + 1, false));
                board[i] = "";
            }
        }
        return best;
    } else {
        let best = Infinity;
        for (let i = 0; i < 9; i++) {
            if (board[i] === "") {
                board[i] = "X";
                best = Math.min(best, minimax(board, depth + 1, true));
                board[i] = "";
            }
        }
        return best;
    }
}

function checkWinner(b, size) {
    const lines = [];
    const winLen = size === 3 ? 3 : 4; // 3-in-row for 3x3, 4-in-row for 5x5 & 7x7!
    for (let i = 0; i < size; i++) {
        for (let j = 0; j <= size - winLen; j++) {
            let row = [], col = [];
            for (let k = 0; k < winLen; k++) {
                row.push(i * size + j + k);
                col.push((j + k) * size + i);
            }
            lines.push(row, col);
        }
    }
    for (let r = 0; r <= size - winLen; r++) {
        for (let c = 0; c <= size - winLen; c++) {
            let d1 = [], d2 = [];
            for (let k = 0; k < winLen; k++) {
                d1.push((r + k) * size + (c + k));
                d2.push((r + k) * size + (c + winLen - 1 - k));
            }
            lines.push(d1, d2);
        }
    }
    for (let l of lines) {
        const first = b[l[0]];
        if (first && l.every(idx => b[idx] === first)) return { w: first, line: l };
    }
    return b.includes("") ? null : "draw";
}
